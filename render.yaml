# CIDB Tender API — Render Blueprint.
# Deploy: Render Dashboard → New → Blueprint → select this repo (main branch).
# Secrets (DATABASE_URL, API_KEY, ADMIN_API_KEY) are entered in the Render
# dashboard at create time via `sync: false` — never committed here.
services:
  # Public REST API: /api/v1/*, Swagger at /docs, health at /api/v1/health.
  # Free plan = no credit card required. Sleeps after 15 min idle (~30-60s
  # cold start). Syncs are triggered by an external scheduler:
  #   POST https://cidb-tender-api.onrender.com/api/v1/admin/sync
  #   Header: X-API-Key: <ADMIN_API_KEY>   Every: 30 minutes
  # (Background workers have no free tier, so this Blueprint ships the API
  # only. The endpoint returns 202 and syncs in the background; syncs are
  # overlap-safe and idempotent, so retries are harmless.)
  - type: web
    name: cidb-tender-api
    runtime: docker
    region: frankfurt
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/api/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Public origin of this service. Makes the OpenAPI document at /docs and
      # docs/openapi.yaml advertise absolute server URLs (code generators,
      # Postman, other clients). Keep in sync with the Render-generated URL.
      - key: PUBLIC_BASE_URL
        value: https://cidb-tender-api.onrender.com
      # Neon DIRECT (non-pooler) connection string.
      - key: DATABASE_URL
        sync: false
      # Read-API secret (give this one to TenderBase as CIDB_API_KEY).
      - key: API_KEY
        sync: false
      # Admin secret — must differ from API_KEY. Also used by the external
      # scheduler to trigger syncs.
      - key: ADMIN_API_KEY
        sync: false
      # Browser origins allowed to call this API (comma-separated), e.g. the
      # TenderBase web app. Server-to-server callers send no Origin header and
      # are always allowed; leaving this empty blocks cross-origin browser use.
      - key: CORS_ORIGIN
        sync: false
