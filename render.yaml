# CIDB Tender API — service-owned Render Blueprint.
# Canonical config for the CIDB service(s); standalone (no `rootDir`), so it
# works as-is if `cidb-api/` ever becomes its own repository.
# NOTE: Render only auto-detects a Blueprint at the repo root, so the same
# service is also declared in /render.yaml (with `rootDir: cidb-api` added).
# Keep both files in sync — the root copy is what "New → Blueprint" deploys.
# Secrets are entered in the Render dashboard at create time (never committed).
# NOTE: `branch` pins the in-progress branch. After merging to main,
# change to `branch: main` (or remove the line).
services:
  # Public REST API: /api/v1/*, Swagger at /docs, health at /api/v1/health.
  # Free plan = no credit card. Syncs via external scheduler (see /render.yaml).
  - type: web
    name: cidb-tender-api
    runtime: docker
    branch: arena/01a07d97-tenderbaseapk
    region: frankfurt
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/api/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Neon DIRECT (non-pooler) connection string.
      - key: DATABASE_URL
        sync: false
      # Read-API secret (give this one to TenderBase as CIDB_API_KEY).
      - key: API_KEY
        sync: false
      # Admin secret — must differ from API_KEY.
      - key: ADMIN_API_KEY
        sync: false
