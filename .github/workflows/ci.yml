name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck · tests · OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite runs without a live database: Postgres DDL is verified against
      # PGlite and the API against the in-memory DbClient, so `prisma generate`
      # is not required here.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: OpenAPI document is up to date
        run: npm run openapi:check
