  title: CIDB Tender API
  version: 1.0.0
  description: >-
    Standalone normalized API over publicly available CIDB tender information.
    Source: Construction Industry Development Board (CIDB).


    ### Authentication


    Every endpoint except `GET /health` and `GET /` needs an API key: click
    **Authorize** and paste the key value (the `X-API-Key` header is added
    automatically). Read endpoints accept any active key; `/admin/*` and
    `/health/detailed` need an **ADMIN**-role key.


    ### Errors


    All failures use one envelope: `{ "error": { "code": "...", "message": "..."
    } }` — `400` invalid request, `401` missing/invalid key, `403` admin key
    required, `404` not found, `409` sync already running, `429` rate limited,
    `500`/`503` service fault.


    ### Rate limits


    Global: 300 requests per 60s. Admin routes: 60 per 60s.
