  /admin/sync:
    post:
      operationId: triggerSync
      summary: Trigger a sync
      tags:
        - admin
      description: Trigger a CIDB synchronization. Runs asynchronously and returns 202
        immediately — poll GET /admin/sync/{id} for progress. Syncs are
        overlap-safe and idempotent, so retries are harmless.
      security:
        - apiKey: []
      responses:
        "202":
          description: Sync accepted and running in the background; poll GET
            /admin/sync/{id} for progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  syncId:
                    type: string
                required:
                  - status
                  - syncId
                additionalProperties: false
                description: Sync accepted and running in the background; poll GET
                  /admin/sync/{id} for progress.
        "401":
          description: Unauthorized — the `X-API-Key` header is missing, unknown or
            inactive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
                description: Unauthorized — the `X-API-Key` header is missing, unknown or
                  inactive.
        "403":
          description: Forbidden — the key is valid but does not have the ADMIN role.
          content:
            application/json:
              schema:
                type: object
